<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ViaVLC - Paradas EMT y Metrovalencia</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <div class="app-container">
        <!-- Floating UI Panel -->
        <header class="glass-panel main-header">
            <div class="header-content">
                <!-- Always Visible Area -->
                <div class="header-top" id="header-top">
                    <div class="logo-wrapper">
                        <div class="logo-icon"></div>
                        <h1>ViaVLC</h1>
                    </div>
                    <div class="search-container">
                        <div class="search-flex" style="display: flex; gap: 5px;">
                            <select id="zone-selector" class="zone-selector">
                                <option value="valencia">València</option>
                                <option value="alicante">Alacant</option>
                            </select>
                            <input type="text" id="search-input" placeholder="Buscar parada o estación..." autocomplete="off" style="flex: 1;">
                        </div>
                        <div id="search-results" class="search-results hidden"></div>
                    </div>
                    <div class="toggle-icon">▼</div>
                </div>
                
                <!-- Collapsible Area -->
                <div class="header-body collapsed" id="header-body">
                    <p class="subtitle">Explora paradas de Metrobús, EMT, Metro y TRAM en tiempo real</p>
                    <div class="legend">
                        <div class="legend-item active" data-network="metrobus" style="cursor:pointer;">
                            <span class="legend-dot" style="background:#FFB81C;"></span> Metrobús
                        </div>
                        <div class="legend-item active" data-network="bus" style="cursor:pointer;">
                            <span class="legend-dot bus-dot"></span> EMT València
                        </div>
                        <div class="legend-item active" data-network="metro" style="cursor:pointer;">
                            <span class="legend-dot metro-dot"></span> Metrovalencia
                        </div>
                        <div class="legend-item active" data-network="tram" style="cursor:pointer;">
                            <span class="legend-dot" style="background:#f97316;"></span> TRAM d'Alacant
                        </div>
                    </div>
                    
                    <div class="status-indicator">
                        <span class="pulse"></span> <span id="status-text">Actualizando datos...</span>
                    </div>
                    
                    <div class="disclaimer">
                        App no oficial. Los datos pertenecen a ATMV, EMT y Metrovalencia. Creado sin fines de lucro.
                    </div>
                </div>
            </div>
        </header>

        <!-- Floating Locate Button -->
        <button id="locate-btn" class="glass-btn locate-btn" aria-label="Centrar en mi ubicación">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
        
        <!-- Floating Journey Button -->
        <button id="open-journey-btn" class="glass-btn open-journey-btn" aria-label="Planear Viaje">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
            <span style="font-weight:600; margin-left:8px; font-size:14px;">Viajar</span>
        </button>

        <!-- Journey Planner Panel -->
        <div id="journey-panel" class="glass-panel journey-panel hidden">
            <div class="journey-header">
                <h2>Planear Viaje</h2>
                <button id="close-journey-btn" class="close-btn">&times;</button>
            </div>
            <div class="journey-inputs">
                <div class="autocomplete-wrapper">
                    <div class="input-group">
                        <span class="icon">📍</span>
                        <input type="text" id="journey-origin" placeholder="Tu ubicación" title="Déjalo en blanco para usar el GPS" autocomplete="off">
                    </div>
                    <ul id="origin-autocomplete" class="autocomplete-dropdown hidden"></ul>
                </div>
                <div class="autocomplete-wrapper">
                    <div class="input-group">
                        <span class="icon">🏁</span>
                        <input type="text" id="journey-dest" placeholder="Destino (Calle, Local...)" autocomplete="off">
                    </div>
                    <ul id="dest-autocomplete" class="autocomplete-dropdown hidden"></ul>
                </div>
                <button id="journey-search-btn" class="action-btn">Buscar Rutas</button>
            </div>
            <div id="journey-results" class="journey-results"></div>
        </div>

        <!-- Map Container -->
        <main id="map"></main>
        
        <!-- PWA Install Button -->
        <button id="pwa-install-btn" class="glass-btn pwa-install-btn" style="display: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Instalar App
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- App JS -->
    <script src="js/app.js?v=25"></script>
</body>
</html>
